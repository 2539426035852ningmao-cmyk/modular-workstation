name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Local documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress '*.md' 'docs/**/*.md' '.github/**/*.md'
          fail: true
          failIfEmpty: true
          token: ''

  windows:
    name: Windows desktop checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Clean dependency install
        run: npm ci
      - name: Build and existing Electron tests
        run: npm test
      - name: Package Windows candidate
        run: npm run package:win
      - name: Verify packaged application
        run: node scripts/verify-package.cjs ../portable/ModularWorkstation-win32-x64
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/design/previews/runtime/
          retention-days: 14
          if-no-files-found: warn
